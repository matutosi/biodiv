name: Test

# Runs the lint and the Node tests on every Node version the project claims to
# support (package.json engines: >=18.18). Several PCs work on this repository
# and their Node versions drift apart, so the matrix is what catches code that
# only runs on the version that happens to be installed here.
#
# The browser tests (e2e/, pytest + Playwright) are not run here: installing a
# browser costs a few minutes per job. Run them by hand before merging to main.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.18', '20', '22', '24']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test
